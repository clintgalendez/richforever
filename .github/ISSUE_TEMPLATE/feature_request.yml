name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could RichForever help?
  - type: textarea
    id: privacy
    attributes:
      label: Privacy considerations
      description: Would this share anything new with Discord? Should it be opt-in?
