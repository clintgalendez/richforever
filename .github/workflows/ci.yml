name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  addon:
    name: Addon (Lua 5.1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lua 5.1 and luacheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.1 lua-check
      - name: Lint
        run: luacheck addon
      - name: Test (regenerates the strip fixtures)
        run: lua5.1 addon/tests/run.lua --fixtures tests/fixtures
      - name: Fixtures are up to date
        run: git diff --exit-code -- tests/fixtures

  companion:
    name: Companion (.NET, Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Restore (lock files, NuGet vulnerability audit)
        run: dotnet restore companion --locked-mode
      - name: Formatting
        run: dotnet format companion --verify-no-changes --no-restore
      - name: Build (analyzers, warnings as errors)
        run: dotnet build companion -c Release --no-restore
      - name: Test
        run: dotnet test companion -c Release --no-build
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version 0.0.0-ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: richforever-ci-build
          path: dist/
          retention-days: 7

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress "./**/*.md"
          fail: true

  workflows:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: pipx run --spec actionlint-py==1.7.12.25 actionlint
      - name: zizmor
        run: pipx run zizmor==1.32.0 --offline .github/workflows

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MS-PL
