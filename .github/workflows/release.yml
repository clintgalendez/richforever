name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  addon:
    name: Addon tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.1 lua-check
      - run: luacheck addon
      - run: lua5.1 addon/tests/run.lua

  build:
    name: Build release assets
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { throw "Tag '$env:TAG' is not v<semver>." }
          $version = $Matches[1]
          $toc = (Select-String -Path addon/RichForever/RichForever.toc -Pattern '^## Version: (.+)$').Matches[0].Groups[1].Value.Trim()
          $props = ([xml](Get-Content companion/Directory.Build.props)).Project.PropertyGroup.Version
          if ($toc -ne $version) { throw "Addon TOC version $toc does not match tag $version." }
          if ($props -ne $version) { throw "Companion version $props does not match tag $version." }
          if (-not (Select-String -Path CHANGELOG.md -SimpleMatch "## [$version]")) { throw "CHANGELOG.md has no section for $version." }
          "VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore companion --locked-mode
      - run: dotnet build companion -c Release --no-restore
      - run: dotnet test companion -c Release --no-build
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version $env:VERSION
      - name: Checksums verify with sha256sum
        shell: bash
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $pattern = '(?ms)^## \[' + [regex]::Escape($env:VERSION) + '\][^\n]*\n(.*?)(?=^## \[|\z)'
          if ((Get-Content CHANGELOG.md -Raw) -notmatch $pattern) { throw "No CHANGELOG.md section for $env:VERSION." }
          $verify = 'Verify downloads with SHA256SUMS.txt or `gh attestation verify <file> --repo ' + $env:GITHUB_REPOSITORY + '`.'
          ($Matches[1].Trim(), '', $verify) | Set-Content dist/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [addon, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "RichForever $TAG" \
            --notes-file dist/release-notes.md "${flags[@]}"
